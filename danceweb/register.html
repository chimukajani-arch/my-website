<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - DanceFest therealtoliver's</title>

    <link rel="stylesheet" href="styleweb.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="indexweb.html">DanceFest</a>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="indexweb.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="register.html">Register</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="login.html">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h2 class="text-center mb-4">Register for DanceFest</h2>

        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input  type="text" id="fullname" class="form-control" placeholder="Enter your name">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email">
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Create a password">
            </div>

            <button type="submit" class="btn btn-warning w-100">
                       Register
</button>
        </form>

        <p class="text-center mt-3">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>
</div>
<div class="container mt-5">
   
<script src="web.js"></script>
</body>
</html>
